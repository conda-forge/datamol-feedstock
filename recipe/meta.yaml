{% set name = "datamol" %}
{% set version = "0.13.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/datamol-{{ version }}.tar.gz
  sha256: 8f226040eff6cd1ac6c8e48e1297b2c10a505ee4808ec926aa73ae9bde68df9b

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - tqdm >=4.66
    - loguru >=0.7
    - joblib >=1.3
    - fsspec >=2023.9.2
    - aiohttp
    - pandas >=2.2
    - numpy >=1.26
    - scipy >=1.11
    - platformdirs >=4
    - scikit-learn >=1.4
    - packaging >=23.2
    - rdkit >=2024.9.1
    - gcsfs >=2024.3
    - s3fs >=2024.3
    - openpyxl >=3.1
    - xlsxwriter >=3.2
    - pyarrow >=15
    - matplotlib-base >=3.8
    - networkx >=3.2
    - nglview >=3.1
    - pillow >=10
    - selfies >=2.1

test:
  requires:
    - python {{ python_min }}
  imports:
    - datamol
  commands:
    - python -c "import datamol as dm; assert dm.to_smiles(dm.to_mol('CCO')) == 'CCO'"

about:
  home: https://github.com/datamol-io/datamol
  summary: A python library to work with molecules. Built on top of RDKit.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - zhu0619
    - maclandrol
